name: Harborth constant checks

on:
  push:
    branches: [main]
    paths:
      - 'results/harborth-constant/**'
      - '.github/workflows/harborth-constant.yml'
  pull_request:
    paths:
      - 'results/harborth-constant/**'
      - '.github/workflows/harborth-constant.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: harborth-constant-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  shapes:
    name: Independent check for p = 11 and 13
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@v7.0.1

      - name: Check every concentrated shape
        working-directory: results/harborth-constant
        run: python3 checks/shape_check.py

  lean:
    name: Lean proof
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
        working-directory: results/harborth-constant/lean
    steps:
      - name: Check out
        uses: actions/checkout@v7.0.1

      - name: Install Lean through elan
        run: |
          curl --fail --location --retry 3 \
            "https://github.com/leanprover/elan/releases/download/v4.2.4/elan-x86_64-unknown-linux-gnu.tar.gz" \
            --output "$RUNNER_TEMP/elan.tar.gz"
          echo "42b94d4244e8353142c456ec0e4ca6528fd898a6c604d4059f494e706e431f63  $RUNNER_TEMP/elan.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/elan.tar.gz" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/elan-init" -y --default-toolchain none
          export PATH="$HOME/.elan/bin:$PATH"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          elan toolchain install "$(cat lean-toolchain)"
          lean --version

      - name: Restore proof build cache
        uses: actions/cache@v6.1.0
        with:
          path: results/harborth-constant/lean/.lake/build
          key: harborth-constant-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('results/harborth-constant/lean/lean-toolchain', 'results/harborth-constant/lean/lake-manifest.json', 'results/harborth-constant/lean/lakefile.toml', 'results/harborth-constant/lean/**/*.lean', '!results/harborth-constant/lean/.lake/**') }}

      - name: Fetch Mathlib cache
        run: lake exe cache get

      - name: Build proof, statement checks, and axiom guards
        run: lake build

  check:
    name: Check harborth-constant
    needs: [shapes, lean]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require both checks
        env:
          SHAPES_RESULT: ${{ needs.shapes.result }}
          LEAN_RESULT: ${{ needs.lean.result }}
        run: test "$SHAPES_RESULT" = success && test "$LEAN_RESULT" = success
