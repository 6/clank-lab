name: Mock plectic invariant checks

on:
  push:
    branches: [main]
    paths:
      - 'results/mock-plectic-invariants/**'
      - '.github/workflows/mock-plectic-invariants.yml'
  pull_request:
    paths:
      - 'results/mock-plectic-invariants/**'
      - '.github/workflows/mock-plectic-invariants.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mock-plectic-invariants-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  replay:
    name: Replay part ${{ matrix.part }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Set up Pixi
        uses: prefix-dev/setup-pixi@82d477f15f3a381dbcc8adc1206ce643fe110fb7 # v0.9.3
        with:
          pixi-version: v0.55.0
          run-install: false
          cache: false

      - name: Recompute coefficient vectors
        working-directory: results/mock-plectic-invariants
        env:
          OPENBLAS_NUM_THREADS: 1
          OMP_NUM_THREADS: 1
        run: >-
          pixi exec --channel conda-forge --spec 'python=3.12' --spec 'sagelib=10.8'
          -- python checks/replay.py --part ${{ matrix.part }}/8

  check:
    name: Check mock-plectic-invariants
    runs-on: ubuntu-latest
    needs: replay
    steps:
      - run: echo 'All certificate replays passed.'
