<svg xmlns="http://www.w3.org/2000/svg" width="650" height="490" viewBox="0 0 650 490" role="img" aria-labelledby="title desc">
<title id="title">The six clique modules of the 73-vertex graph</title>
<desc id="desc">Each circle is a complete graph, and a line means all edges between two circles. The two left cliques have sizes 32 and 33; the four right cliques have size 2.</desc>
<rect width="650" height="490" fill="white"/>
<line x1="150" y1="130" x2="490" y2="60" stroke="rgb(113,128,150)" stroke-width="2"/>
<line x1="150" y1="130" x2="490" y2="180" stroke="rgb(113,128,150)" stroke-width="2"/>
<line x1="150" y1="130" x2="490" y2="300" stroke="rgb(113,128,150)" stroke-width="2"/>
<line x1="150" y1="130" x2="490" y2="420" stroke="rgb(113,128,150)" stroke-width="2"/>
<line x1="150" y1="310" x2="490" y2="60" stroke="rgb(113,128,150)" stroke-width="2"/>
<line x1="150" y1="310" x2="490" y2="180" stroke="rgb(113,128,150)" stroke-width="2"/>
<line x1="150" y1="310" x2="490" y2="300" stroke="rgb(113,128,150)" stroke-width="2"/>
<line x1="150" y1="310" x2="490" y2="420" stroke="rgb(113,128,150)" stroke-width="2"/>
<circle cx="150" cy="130" r="39" fill="rgb(237,244,252)" stroke="rgb(35,71,107)" stroke-width="2"/>
<text x="150" y="138" text-anchor="middle" font-family="serif" font-size="25" fill="rgb(20,46,73)">K<tspan baseline-shift="sub" font-size="17">32</tspan></text>
<circle cx="150" cy="310" r="39" fill="rgb(237,244,252)" stroke="rgb(35,71,107)" stroke-width="2"/>
<text x="150" y="318" text-anchor="middle" font-family="serif" font-size="25" fill="rgb(20,46,73)">K<tspan baseline-shift="sub" font-size="17">33</tspan></text>
<circle cx="490" cy="60" r="39" fill="rgb(237,244,252)" stroke="rgb(35,71,107)" stroke-width="2"/>
<text x="490" y="68" text-anchor="middle" font-family="serif" font-size="25" fill="rgb(20,46,73)">K<tspan baseline-shift="sub" font-size="17">2</tspan></text>
<circle cx="490" cy="180" r="39" fill="rgb(237,244,252)" stroke="rgb(35,71,107)" stroke-width="2"/>
<text x="490" y="188" text-anchor="middle" font-family="serif" font-size="25" fill="rgb(20,46,73)">K<tspan baseline-shift="sub" font-size="17">2</tspan></text>
<circle cx="490" cy="300" r="39" fill="rgb(237,244,252)" stroke="rgb(35,71,107)" stroke-width="2"/>
<text x="490" y="308" text-anchor="middle" font-family="serif" font-size="25" fill="rgb(20,46,73)">K<tspan baseline-shift="sub" font-size="17">2</tspan></text>
<circle cx="490" cy="420" r="39" fill="rgb(237,244,252)" stroke="rgb(35,71,107)" stroke-width="2"/>
<text x="490" y="428" text-anchor="middle" font-family="serif" font-size="25" fill="rgb(20,46,73)">K<tspan baseline-shift="sub" font-size="17">2</tspan></text>
<text x="325" y="478" text-anchor="middle" font-family="sans-serif" font-size="16" fill="rgb(52,64,84)">Each line represents a complete join of its endpoint cliques.</text></svg>
