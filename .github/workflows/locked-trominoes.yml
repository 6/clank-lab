name: Locked trominoes checks

on:
  push:
    branches: [main]
    paths:
      - 'results/locked-trominoes/**'
      - '.github/workflows/locked-trominoes.yml'
  pull_request:
    paths:
      - 'results/locked-trominoes/**'
      - '.github/workflows/locked-trominoes.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: locked-trominoes-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quick:
    name: Certificate checkers
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
        working-directory: results/locked-trominoes
    steps:
      - name: Check out
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.14.8'

      - name: Check blocks, seams, controls and corruptions
        run: python3 checks/check.py

  lean:
    name: Lean proof
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
        working-directory: results/locked-trominoes/lean
    steps:
      - name: Check out
        uses: actions/checkout@v7.0.1

      - name: Install Lean with elan
        run: |
          arch=$(uname -m)
          curl --fail --location --retry 3 \
            "https://github.com/leanprover/elan/releases/download/v4.2.4/elan-${arch}-unknown-linux-gnu.tar.gz" \
            --output "$RUNNER_TEMP/elan.tar.gz"
          tar -xzf "$RUNNER_TEMP/elan.tar.gz" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/elan-init" -y --default-toolchain none
          export PATH="$HOME/.elan/bin:$PATH"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          elan toolchain install "$(cat lean-toolchain)"
          lean --version

      - name: Restore build cache
        uses: actions/cache@v6.1.0
        with:
          path: results/locked-trominoes/lean/.lake/build
          key: locked-trominoes-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('results/locked-trominoes/lean/lean-toolchain', 'results/locked-trominoes/lean/lake-manifest.json', 'results/locked-trominoes/lean/lakefile.toml', 'results/locked-trominoes/lean/**/*.lean', '!results/locked-trominoes/lean/.lake/**') }}

      - name: Build proof, statement and axiom checks
        run: lake build

  checks:
    name: Check locked-trominoes
    needs: [quick, lean]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      QUICK_RESULT: ${{ needs.quick.result }}
      LEAN_RESULT: ${{ needs.lean.result }}
    steps:
      - name: Require both checks
        run: |
          test "$QUICK_RESULT" = success
          test "$LEAN_RESULT" = success
