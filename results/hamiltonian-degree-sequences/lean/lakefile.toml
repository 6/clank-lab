name = "nwDigraph"
version = "0.1.0"
defaultTargets = ["NWDigraph", "Check"]

[leanOptions]
autoImplicit = false

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.34.0"

[[lean_lib]]
name = "NWDigraph"
roots = ["Statement", "Lemmas", "Small", "Family", "Cycles", "Main"]

[[lean_lib]]
name = "Check"
