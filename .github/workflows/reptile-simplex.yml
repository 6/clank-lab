name: Reptile simplex checks

on:
  push:
    branches: [main]
    paths:
      - 'results/reptile-simplex/**'
      - '.github/workflows/reptile-simplex.yml'
  pull_request:
    paths:
      - 'results/reptile-simplex/**'
      - '.github/workflows/reptile-simplex.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reptile-simplex-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Check reptile-simplex
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
        working-directory: results/reptile-simplex
    steps:
      - name: Check out
        uses: actions/checkout@v7.0.1
      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - name: Check the certificate
        run: sh checks/check.sh
