name: EKG bounds checks

on:
  push:
    branches: [main]
    paths:
      - 'results/ekg-bounds/**'
      - '.github/workflows/ekg-bounds.yml'
  pull_request:
    paths:
      - 'results/ekg-bounds/**'
      - '.github/workflows/ekg-bounds.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ekg-bounds-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quick:
    name: Certificate and prefix checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: results/ekg-bounds
    steps:
      - name: Check out
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.14.8'

      - name: Install C and C++ compilers
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc g++

      - name: Install Python requirements
        run: python3 -m pip install -r checks/requirements.txt

      - name: Check the certificate and replay the first 10^8 terms
        run: python3 checks/check.py quick --work "$RUNNER_TEMP/ekg-bounds-quick"

  lean:
    name: Lean proof, statement and axiom checks
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      LEAN_NUM_THREADS: '2'
    defaults:
      run:
        shell: bash
        working-directory: results/ekg-bounds/lean
    steps:
      - name: Check out
        uses: actions/checkout@v7.0.1

      - name: Install Lean with elan
        run: |
          arch=$(uname -m)
          curl --fail --location --retry 3 \
            "https://github.com/leanprover/elan/releases/download/v4.2.4/elan-${arch}-unknown-linux-gnu.tar.gz" \
            --output "$RUNNER_TEMP/elan.tar.gz"
          tar -xzf "$RUNNER_TEMP/elan.tar.gz" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/elan-init" -y --default-toolchain none
          export PATH="$HOME/.elan/bin:$PATH"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          elan toolchain install "$(cat lean-toolchain)"
          lean --version

      - name: Restore build cache
        uses: actions/cache@v6.1.0
        with:
          path: results/ekg-bounds/lean/.lake/build
          key: ekg-bounds-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('results/ekg-bounds/lean/lean-toolchain', 'results/ekg-bounds/lean/lake-manifest.json', 'results/ekg-bounds/lean/lakefile.toml', 'results/ekg-bounds/lean/**/*.lean', '!results/ekg-bounds/lean/.lake/**') }}

      - name: Fetch Mathlib cache
        run: lake exe cache get

      - name: Build the proof with its statement, first-terms and axiom checks
        run: lake build

  checks:
    name: Check ekg-bounds
    needs: [quick, lean]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      QUICK_RESULT: ${{ needs.quick.result }}
      LEAN_RESULT: ${{ needs.lean.result }}
    steps:
      - name: Require both checks
        run: |
          test "$QUICK_RESULT" = success
          test "$LEAN_RESULT" = success
