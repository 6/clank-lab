name: Planar 4- and 9-cycle counterexample checks

on:
  push:
    branches: [main]
    paths:
      - 'results/steinberg-c4-c9/**'
      - '.github/workflows/steinberg-c4-c9.yml'
  pull_request:
    paths:
      - 'results/steinberg-c4-c9/**'
      - '.github/workflows/steinberg-c4-c9.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: steinberg-c4-c9-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Check steinberg-c4-c9
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
        working-directory: results/steinberg-c4-c9
    steps:
      - name: Check out
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.14.8'

      - name: Check the certificate
        run: sh checks/check.sh
