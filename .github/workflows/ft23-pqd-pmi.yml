name: Positive dependence checks

on:
  push:
    branches: [main]
    paths:
      - 'results/ft23-pqd-pmi/**'
      - '.github/workflows/ft23-pqd-pmi.yml'
  pull_request:
    paths:
      - 'results/ft23-pqd-pmi/**'
      - '.github/workflows/ft23-pqd-pmi.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lean:
    name: Lean proof
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: results/ft23-pqd-pmi/lean
    steps:
      - name: Check out
        uses: actions/checkout@v7.0.1
      - name: Install Lean with elan
        run: |
          arch=$(uname -m)
          curl --fail --location --retry 3 \
            "https://github.com/leanprover/elan/releases/download/v4.2.4/elan-${arch}-unknown-linux-gnu.tar.gz" \
            --output "$RUNNER_TEMP/elan.tar.gz"
          tar -xzf "$RUNNER_TEMP/elan.tar.gz" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/elan-init" -y --default-toolchain none
          export PATH="$HOME/.elan/bin:$PATH"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Download library cache
        run: lake exe cache get
      - name: Check proof, statement, examples and axioms
        run: lake build

  checks:
    name: Check ft23-pqd-pmi
    needs: [lean]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      LEAN_RESULT: ${{ needs.lean.result }}
    steps:
      - name: Require the Lean check
        run: test "$LEAN_RESULT" = success
