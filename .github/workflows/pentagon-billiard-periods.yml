name: Pentagon billiard periods checks

on:
  push:
    branches: [main]
    paths:
      - 'results/pentagon-billiard-periods/**'
      - '.github/workflows/pentagon-billiard-periods.yml'
  pull_request:
    paths:
      - 'results/pentagon-billiard-periods/**'
      - '.github/workflows/pentagon-billiard-periods.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pentagon-billiard-periods-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quick:
    name: Checking programs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
        working-directory: results/pentagon-billiard-periods
    steps:
      - name: Check out
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.10'

      - name: Check the six trajectories and corruptions
        run: python3 checks/check.py

  lean:
    name: Lean proof
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
        working-directory: results/pentagon-billiard-periods/lean
    steps:
      - name: Check out
        uses: actions/checkout@v7.0.1

      - name: Install Lean with elan
        run: |
          arch=$(uname -m)
          case "$arch" in
            x86_64) elan_sha256=42b94d4244e8353142c456ec0e4ca6528fd898a6c604d4059f494e706e431f63 ;;
            aarch64|arm64)
              arch=aarch64
              elan_sha256=05febd124d84ebf994b2e7479922a5650b1e950c17ae3bd1ddd776b65bb72bf9 ;;
            *) echo "Unsupported architecture for elan: $arch" >&2; exit 1 ;;
          esac
          curl --fail --location --retry 3 \
            "https://github.com/leanprover/elan/releases/download/v4.2.4/elan-${arch}-unknown-linux-gnu.tar.gz" \
            --output "$RUNNER_TEMP/elan.tar.gz"
          echo "$elan_sha256  $RUNNER_TEMP/elan.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/elan.tar.gz" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/elan-init" -y --default-toolchain none
          export PATH="$HOME/.elan/bin:$PATH"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          elan toolchain install "$(cat lean-toolchain)"
          lean --version

      - name: Restore build cache
        uses: actions/cache@v6.1.0
        with:
          path: results/pentagon-billiard-periods/lean/.lake/build
          key: pentagon-billiard-periods-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('results/pentagon-billiard-periods/lean/lean-toolchain', 'results/pentagon-billiard-periods/lean/lake-manifest.json', 'results/pentagon-billiard-periods/lean/lakefile.toml', 'results/pentagon-billiard-periods/lean/**/*.lean', '!results/pentagon-billiard-periods/lean/.lake/**') }}

      - name: Build proof, statement checks and axiom guards
        run: lake build

  checks:
    name: Check pentagon-billiard-periods
    needs: [quick, lean]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      QUICK_RESULT: ${{ needs.quick.result }}
      LEAN_RESULT: ${{ needs.lean.result }}
    steps:
      - name: Require both checks
        run: |
          test "$QUICK_RESULT" = success
          test "$LEAN_RESULT" = success
