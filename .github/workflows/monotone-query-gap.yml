name: Monotone query gap checks

on:
  push:
    branches: [main]
    paths:
      - 'results/monotone-query-gap/**'
      - '.github/workflows/monotone-query-gap.yml'
  pull_request:
    paths:
      - 'results/monotone-query-gap/**'
      - '.github/workflows/monotone-query-gap.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: monotone-query-gap-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lean:
    name: Lean proof
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
        working-directory: results/monotone-query-gap/lean
    steps:
      - name: Check out
        uses: actions/checkout@v7.0.1

      - name: Install Lean through elan
        run: |
          arch=$(uname -m)
          curl --fail --location --retry 3 \
            "https://github.com/leanprover/elan/releases/download/v4.2.4/elan-${arch}-unknown-linux-gnu.tar.gz" \
            --output "$RUNNER_TEMP/elan.tar.gz"
          tar -xzf "$RUNNER_TEMP/elan.tar.gz" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/elan-init" -y --default-toolchain none
          export PATH="$HOME/.elan/bin:$PATH"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          elan toolchain install "$(cat lean-toolchain)"
          lean --version

      - name: Restore proof build cache
        uses: actions/cache@v6.1.0
        with:
          path: results/monotone-query-gap/lean/.lake/build
          key: monotone-query-gap-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('results/monotone-query-gap/lean/lean-toolchain', 'results/monotone-query-gap/lean/lake-manifest.json', 'results/monotone-query-gap/lean/lakefile.toml', 'results/monotone-query-gap/lean/**/*.lean', '!results/monotone-query-gap/lean/.lake/**') }}

      - name: Fetch Mathlib cache
        run: lake exe cache get

      - name: Build proof, examples, and axiom guards
        run: lake build

  certificates:
    name: Exact certificates and corruption controls
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
        working-directory: results/monotone-query-gap
    steps:
      - name: Check out
        uses: actions/checkout@v7.0.1

      - name: Check both certificates and corruption controls
        run: python3 -I checks/check.py

  check:
    name: Check monotone-query-gap
    needs: [lean, certificates]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require successful proof build
        env:
          LEAN_RESULT: ${{ needs.lean.result }}
          CERTIFICATE_RESULT: ${{ needs.certificates.result }}
        run: |
          test "$LEAN_RESULT" = success
          test "$CERTIFICATE_RESULT" = success
