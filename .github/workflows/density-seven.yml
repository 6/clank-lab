name: Density Hales–Jewett 7 checks

on:
  push:
    branches: [main]
    paths:
      - 'results/density-seven/**'
      - '.github/workflows/density-seven.yml'
  pull_request:
    paths:
      - 'results/density-seven/**'
      - '.github/workflows/density-seven.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: density-seven-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quick:
    name: Quick check ${{ matrix.part }}/8
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2, 3, 4, 5, 6, 7, 8]
    env:
      PART: ${{ matrix.part }}
    defaults:
      run:
        shell: bash
        working-directory: results/density-seven
    steps:
      - name: Check out
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.14.8'

      - name: Build the checking tools, if this part has a proof step
        run: |
          if python3 checks/check.py --quick --part "$PART/8" --list | grep -qx proof-controls; then
            python3 checks/build_tools.py "$RUNNER_TEMP/density-tools"
          fi

      - name: Quick check, part ${{ matrix.part }} of 8
        run: python3 checks/check.py --quick --part "$PART/8" --tools "$RUNNER_TEMP/density-tools" --work "$RUNNER_TEMP/density-quick"

  checks:
    name: Check density-seven
    needs: [quick]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job passed
        env:
          QUICK: ${{ needs.quick.result }}
        run: |
          echo "Quick check, all eight parts: $QUICK"
          [ "$QUICK" = success ]
