name: Multitwist exceptions checks

on:
  push:
    branches: [main]
    paths:
      - 'results/multitwist-exceptions/**'
      - '.github/workflows/multitwist-exceptions.yml'
  pull_request:
    paths:
      - 'results/multitwist-exceptions/**'
      - '.github/workflows/multitwist-exceptions.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: multitwist-exceptions-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quick:
    name: Checking programs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
        working-directory: results/multitwist-exceptions
    steps:
      - name: Check out
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.10'

      - name: Check the curve facts and corruptions
        run: python3 checks/check.py

  lean:
    name: Lean proof
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
        working-directory: results/multitwist-exceptions/lean
    steps:
      - name: Check out
        uses: actions/checkout@v7.0.1

      - name: Install Lean with elan
        run: |
          arch=$(uname -m)
          curl --fail --location --retry 3 \
            "https://github.com/leanprover/elan/releases/download/v4.2.4/elan-${arch}-unknown-linux-gnu.tar.gz" \
            --output "$RUNNER_TEMP/elan.tar.gz"
          tar -xzf "$RUNNER_TEMP/elan.tar.gz" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/elan-init" -y --default-toolchain none
          export PATH="$HOME/.elan/bin:$PATH"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          elan toolchain install "$(cat lean-toolchain)"
          lean --version

      - name: Restore build cache
        uses: actions/cache@v6.1.0
        with:
          path: results/multitwist-exceptions/lean/.lake/build
          key: multitwist-exceptions-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('results/multitwist-exceptions/lean/lean-toolchain', 'results/multitwist-exceptions/lean/lake-manifest.json', 'results/multitwist-exceptions/lean/lakefile.toml', 'results/multitwist-exceptions/lean/**/*.lean', '!results/multitwist-exceptions/lean/.lake/**') }}

      - name: Fetch Mathlib cache
        run: lake exe cache get

      - name: Build proof, statement checks, control and axiom guards
        run: lake build

  checks:
    name: Check multitwist-exceptions
    needs: [quick, lean]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      QUICK_RESULT: ${{ needs.quick.result }}
      LEAN_RESULT: ${{ needs.lean.result }}
    steps:
      - name: Require both checks
        run: |
          test "$QUICK_RESULT" = success
          test "$LEAN_RESULT" = success
