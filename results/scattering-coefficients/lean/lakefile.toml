name = "ErsConj13"
version = "0.1.0"
defaultTargets = ["ErsConj13", "MainLemma", "Realization", "Main", "Examples", "Axioms"]

[leanOptions]
pp.unicode.fun = true
relaxedAutoImplicit = false

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.32.2"

[[lean_lib]]
name = "ErsConj13"
globs = ["ErsConj13.+"]

[[lean_lib]]
name = "MainLemma"

[[lean_lib]]
name = "Realization"

[[lean_lib]]
name = "Main"

[[lean_lib]]
name = "Examples"

[[lean_lib]]
name = "Axioms"
