name: Hayashi conjecture checks

on:
  push:
    branches: [main]
    paths:
      - 'results/hayashi-conjecture/**'
      - '.github/workflows/hayashi-conjecture.yml'
  pull_request:
    paths:
      - 'results/hayashi-conjecture/**'
      - '.github/workflows/hayashi-conjecture.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hayashi-conjecture-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quick:
    name: Both quandles, Filipi's condition and corruptions
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: results/hayashi-conjecture
    steps:
      - name: Check out
        uses: actions/checkout@v7.0.1
      - name: Install Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.14"
      - name: Install checker dependencies
        run: python3 -m pip install --require-hashes -r checks/requirements.txt
      - name: Check
        run: python3 -I checks/check.py

  full:
    name: All distributivity triples of order 5670
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: results/hayashi-conjecture
    steps:
      - name: Check out
        uses: actions/checkout@v7.0.1
      - name: Install Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.14"
      - name: Install checker dependencies
        run: python3 -m pip install --require-hashes -r checks/requirements.txt
      - name: Check
        run: python3 -I checks/check.py --full

  check:
    name: Check hayashi-conjecture
    needs: [quick, full]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require both checks
        env:
          QUICK: ${{ needs.quick.result }}
          FULL: ${{ needs.full.result }}
        run: test "$QUICK" = success && test "$FULL" = success
