name = "Multitwist"
defaultTargets = ["Multitwist", "Check", "V2", "V2Check"]

[leanOptions]
autoImplicit = false
relaxedAutoImplicit = false

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.32.2"

[[lean_lib]]
name = "Multitwist"

[[lean_lib]]
name = "Check"

[[lean_lib]]
name = "V2"

[[lean_lib]]
name = "V2Check"
