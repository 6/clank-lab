<svg xmlns="http://www.w3.org/2000/svg" width="650" height="210" viewBox="0 0 650 210" role="img" aria-labelledby="title desc">
<title id="title">Two hidden switches</title>
<desc id="desc">The solver changes two group-valued switches. The adversary then chooses whether to swap them. The solver sees neither the states nor the choice.</desc>
<rect width="650" height="210" rx="12" fill="rgb(244,246,250)"/>
<g font-family="sans-serif" text-anchor="middle" fill="rgb(23,43,77)">
<text x="155" y="30" font-size="18">Solver changes switches</text>
<text x="480" y="30" font-size="18">Adversary may swap them</text>
<g fill="white" stroke="rgb(54,91,137)" stroke-width="2">
<circle cx="90" cy="100" r="32"/><circle cx="220" cy="100" r="32"/>
<circle cx="415" cy="100" r="32"/><circle cx="545" cy="100" r="32"/>
</g>
<g font-size="27"><text x="90" y="109">?</text><text x="220" y="109">?</text><text x="415" y="109">?</text><text x="545" y="109">?</text></g>
<g fill="none" stroke="rgb(54,91,137)" stroke-width="2.5"><path d="M 275 100 H 345 l -10 -7 m 10 7 -10 7"/><path d="M 435 70 Q 480 42 525 70 l -5 -11 m 5 11 -12 0"/><path d="M 525 132 Q 480 160 435 132 l 12 0 m -12 0 5 11"/></g>
<text x="325" y="190" font-size="16">Both the states and the adversary's choice stay hidden.</text>
</g>
</svg>
